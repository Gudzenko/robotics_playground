controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 15.0
    failure_tolerance: 3.0
    min_x_velocity_threshold: 0.02
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.02
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    use_realtime_priority: false
    enable_stamped_cmd_vel: false
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.20
      movement_time_allowance: 10.0
    goal_checker:
      plugin: nav2_controller::PositionGoalChecker
      stateful: true
      xy_goal_tolerance: 0.30
      xy_goal_tolerance_buffer: 0.05
      path_length_tolerance: 100.0
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 2.0
      lookahead_dist: 0.60
      min_lookahead_dist: 0.40
      max_lookahead_dist: 0.80
      lookahead_time: 0.40
      rotate_to_heading_angular_vel: 0.8
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.15
      approach_velocity_scaling_dist: 0.8
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.40
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.8
      regulated_linear_scaling_min_speed: 0.35
      use_cost_regulated_linear_velocity_scaling: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.35
      max_angular_accel: 16.0
      allow_reversing: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 8.0
      publish_frequency: 4.0
      global_frame: map
      robot_base_frame: base_axle
      transform_tolerance: 0.5
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      footprint: '[[0.49, 0.33], [0.49, -0.33], [-0.585, -0.33], [-0.585, 0.33]]'
      footprint_padding: 0.01
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        footprint_clearing_enabled: true
        max_obstacle_height: 2.0
        combination_method: 1
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          observation_persistence: 0.5
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          obstacle_max_range: 8.0
          obstacle_min_range: 0.20
          raytrace_max_range: 10.0
          raytrace_min_range: 0.20
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.75
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_axle
    odom_topic: /odometry/filtered
    transform_tolerance: 0.5
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    bt_loop_duration: 10

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    wait:
      plugin: nav2_behaviors::Wait
    global_frame: map
    robot_base_frame: base_axle
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 0.8
    enable_stamped_cmd_vel: false

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [3.0, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [1.8, 0.0, 2.2]
    max_decel: [-2.5, 0.0, -2.2]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
    enable_stamped_cmd_vel: false

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_axle
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel
    state_topic: /collision_monitor_state
    transform_tolerance: 0.5
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: [StopZone, SlowZone]
    SlowZone:
      type: polygon
      points: '[[0.80, 0.62], [0.80, -0.62], [-0.82, -0.62], [-0.82, 0.62]]'
      action_type: slowdown
      min_points: 3
      slowdown_ratio: 0.35
      visualize: true
      polygon_pub_topic: /collision_monitor/slow_zone
      enabled: true
    StopZone:
      type: polygon
      points: '[[0.60, 0.43], [0.60, -0.43], [-0.68, -0.43], [-0.68, 0.43]]'
      action_type: stop
      min_points: 3
      visualize: true
      polygon_pub_topic: /collision_monitor/stop_zone
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
      enabled: true

lifecycle_manager_static_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 4.0
    node_names: [controller_server, behavior_server, bt_navigator, velocity_smoother]

navigation_cancel_service:
  ros__parameters:
    use_sim_time: true
    navigate_action: /navigate_to_pose
