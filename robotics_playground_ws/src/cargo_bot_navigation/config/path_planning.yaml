map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''

amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan
    tf_broadcast: true
    transform_tolerance: 0.5
    set_initial_pose: true
    always_reset_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 1.5708
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    update_min_d: 0.10
    update_min_a: 0.10
    resample_interval: 1
    laser_model_type: likelihood_field
    laser_min_range: 0.15
    laser_max_range: 20.0
    max_beams: 120
    z_hit: 0.8
    z_rand: 0.2
    sigma_hit: 0.2
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.25
      use_astar: true
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.5
      resolution: 0.05
      track_unknown_space: true
      rolling_window: false
      footprint: '[[1.30, 0.55], [1.30, -0.55], [-0.85, -0.55], [-0.85, 0.55]]'
      footprint_padding: 0.02
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.57
        cost_scaling_factor: 4.0
      always_send_full_costmap: true

lifecycle_manager_path_planning:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 4.0
    node_names: [map_server, amcl, planner_server]

path_requester:
  ros__parameters:
    use_sim_time: true
    goal_topic: /goal_pose
    path_topic: /planned_path
    planner_action: /compute_path_to_pose
    planner_id: GridBased
    global_frame: map
